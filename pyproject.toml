[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "InvestingOS"
version = "0.1.0"
description = "Local knowledge-graph and curriculum foundation"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
documents = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pypdf>=6,<7"]
transcription = ["faster-whisper>=1.1,<2"]

[project.scripts]
InvestingOS = "investingos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
